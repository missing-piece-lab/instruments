<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Four instruments around one human-AI pair: claims, pulse, judges, ledger">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<path d="M280 78 C 305.0 78, 305.0 150, 330 150" fill="none" stroke="#3d444d" stroke-width="1.5"/>
<path d="M280 222 C 305.0 222, 305.0 150, 330 150" fill="none" stroke="#3d444d" stroke-width="1.5"/>
<path d="M600 78 C 575.0 78, 575.0 150, 550 150" fill="none" stroke="#3d444d" stroke-width="1.5"/>
<path d="M600 222 C 575.0 222, 575.0 150, 550 150" fill="none" stroke="#3d444d" stroke-width="1.5"/>
<rect x="330" y="104" width="220" height="92" rx="46" fill="#271c3b" stroke="#a371f7" stroke-width="1.5"/>
<circle cx="385" cy="150" r="9" fill="none" stroke="#a371f7" stroke-width="2"/><circle cx="495" cy="150" r="9" fill="#a371f7"/>
<line x1="396" y1="150" x2="484" y2="150" stroke="#a371f7" stroke-width="2" stroke-dasharray="3 5"/>
<text x="385" y="181" font-size="12" fill="#9198a1" text-anchor="middle">human</text><text x="495" y="181" font-size="12" fill="#9198a1" text-anchor="middle">agent</text>
<text x="440" y="130" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">the pair</text>
<rect x="40" y="52" width="240" height="52" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="56" y="74" class="m" font-size="14" font-weight="600" fill="#a371f7">claims</text>
<text x="56" y="92" font-size="12.5" fill="#9198a1">what is true, probed</text>
<rect x="40" y="196" width="240" height="52" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="56" y="218" class="m" font-size="14" font-weight="600" fill="#a371f7">pulse</text>
<text x="56" y="236" font-size="12.5" fill="#9198a1">does it still sound like itself</text>
<rect x="600" y="52" width="240" height="52" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="616" y="74" class="m" font-size="14" font-weight="600" fill="#a371f7">judges</text>
<text x="616" y="92" font-size="12.5" fill="#9198a1">two cold reads, both must agree</text>
<rect x="600" y="196" width="240" height="52" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="616" y="218" class="m" font-size="14" font-weight="600" fill="#a371f7">ledger</text>
<text x="616" y="236" font-size="12.5" fill="#9198a1">what is waiting on the human</text>
<text x="440" y="282" font-size="12" fill="#9198a1" text-anchor="middle">the relational axis: measured from the pair, not from either member</text>
</svg>
